icture":[{"media":"(max-width: 767px)","srcset":"https://cdn-edge.kwork.ru/pics/t6/99/22148376-6a6676156c32f.webp?ver=1785099972 1x, https://cdn-edge.kwork.ru/pics/t6_r/99/22148376-6a6676156c32f.webp?ver=1785099972 2x"},{"media":"(min-width: 768px)","srcset":"https://cdn-edge.kwork.ru/pics/t5/99/22148376-6a6676156c32f.webp?ver=1785099972 1x, https://cdn-edge.kwork.ru/pics/t5_r/99/22148376-6a6676156c32f.webp?ver=1785099972 2x"}],"hintWorker":"","hintPayer":"","topBadge":false,"baseVolumePrice":null,"baseVolumeShortName":null,"baseVolume":null,"packageVolume":null,"sellerLevel":2,"isBlackFriday":null,"markType":"","queueCount":0,"days":2,"categoryTitle":"Скрипты, боты и mini apps","categoryUrl":"categories/script-programming"}]},"seoAddText":null,"seoFaq":{"title":"созданию парсеров","items":[[{"id":7656,"list_id":705,"question":"Что такое парсеры и зачем они нужны?","answer":"Парсер - это специальная программа, которая занимается сбором определенной информации. Например, вас интересуют все продавцы Avito, которые предлагают морепродукты. Один из вариантов - потратить несколько дней, чтобы составить таблицу Microsoft Excel. Второй - сделать заказ на фрилансе и получить инструмент, который может собирать продавцов не только морепродуктов, но и любых других товаров, а потом выгружать их в файл формата Microsoft Excel для дальнейшей обработки.","order":0,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":472},{"id":7659,"list_id":705,"question":"Какую информацию предоставить исполнителю для заказа парсера?","answer":"Достаточно словесного описания, но чтобы избежать правок, можно создать техническое задание. В нем опишите параметры будущего парсера, какую информацию и как именно он должен обрабатывать.","order":1,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":188},{"id":7662,"list_id":705,"question":"Как проверить работоспособность парсера?","answer":"Фрилансер пришлет вам готовую программу в архиве. Вы ее распакуете, запустите в работу и убедитесь в работоспособности. Если возникнут сложности или будут обнаружены проблемы, можете запросить правки. Это естественная практика на нашем фриланс-маркете. После решения всех проблемных моментов подтверждаете заказ и продолжаете пользоваться парсером.","order":2,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":348}],[{"id":7665,"list_id":705,"question":"Парсеры на заказ для каких проектов могут сделать фрилансеры?","answer":"Чаще всего заказывают парсеры для получения информации с популярных досок объявлений. Это Avito, украинская, казахстанская версии OLX, сервисы Яндекса, особенно Яндекс Карты. Очень популярен и востребован парсинг позиций с Aliexpress. Небольшая разработка стоимостью 1-2 тысячи рублей в значительной мере оптимизирует работу, связанную с поиском поставщиков.","order":3,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":358},{"id":7668,"list_id":705,"question":"Зачем заказывать парсер, если можно скачать бесплатно или купить готовый?","answer":"Обычно парсер - это программа для выполнения одной или нескольких конкретных задач. Учитывая то, что интерфейс целевых сервисов часто меняется, парсеры могут устаревать и переставать справляться с задачами.","order":4,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":206},{"id":7671,"list_id":705,"question":"Какие условия использования скрипта?","answer":"Обычно скрипты пишутся под систему Microsoft Windows и предназначены для использования на персональном компьютере или ноутбуке. Если речь идет о создании мощного парсера, который будет 24 часа в сутки парсить информацию с Aliexpress, или другого популярного ресурса, может понадобиться аренда сервера, чтобы не перегружать ваш компьютер. Подобные вопросы стоит уточнять у исполнителя. Он может не только предоставить консультацию, но и по вашему поручению подобрать подходящий сервер, купить его и установить на него скрипт.","order":5,"created_at":"2020-12-28 18:22:33","updated_at":"2020-12-28 18:22:33","length":524}]]}}},"isWidePage":true,"isShowSticker":false,"isNeedYescrowDigitalSign":false,"designVersion":"legacy","appTitle":"Kwork","isAppIos":false,"isNeedShowMobileBanner":false,"technicalWorksText":"Уважаемые пользователи. С 7:00 до 8:00 (МСК) на сайте Kwork будут проводиться плановые технические работы. Приносим извинения за временные неудобства.","mobileAppReviews":null,"isInBuildCriticalStylesMode":false,"onlineUserCount":1898,"liveDate":72,"liveDateTimeLeft":"1 мин.","telegramAttrRelativeUrl":"","isBestKwork":false,"isKworkCom":false,"isKworkSu":false,"isPaperjettechCom":false,"isSuperkwork":false,"isTopKworkCom":false,"headerMenu":[{"id":69,"url":"https://kwork.ru/categories/design","name":"Дизайн","columns":[{"isFirstGroup":true,"items":[{"name":"Логотип и брендинг","isFire":false,"isTagNew":false,"isTagBeta":false,"children":[[{"name":"Логотипы","url":"https://kwork.ru/categories/logo/logotipy","isFire":true,"isTagNew":false,"isTagBeta":false},{"name":"Фирменный стиль","url":"https://kwork.ru/categories/logo/firmenniy-stil","isFire":false,"isTagNew":false,"isTagBeta":false},{"name":"Визитки","url":"https://kwork.ru/categories/logo/vizitki","isFire":false,"isTagNew":false,"isTagBeta":false},{"name":"Брендирование и сувенирка","url":"https://kwork.ru/categories/logo/brendirovanie-i-suvenirka","isFire":false,"isTagNew":false,"isTagBeta":false}]]},{"name":"Презентации и инфографика","isFire":false,"isTagNew":false,"isTagBeta":false,"children":[[{"name":"Презентации","url":"https://kwork.ru/categories/presentations-infographics/prezentatsii","isFire":false,"isTagNew":false,"isTagBeta":false},{"name":"Инфографика","url":"https://kwork.ru/categories/presentations-infographics/infografika","isFire":false,"isTagNew":false,"isTagBeta":false},{"name":"Карта и схема","url":"https://kwork.ru/categories/presentations-infographics/karta-skhema","isFire":false,"isTagNew":false,"isTagBeta":false}]]},{"name
