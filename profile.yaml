# Профиль фрилансера: навыки, опыт и стратегия ценообразования.
# Этот файл используется LLM для генерации персонализированных писем.

# Личная информация (используется в письмах)
name: ""  # Имя или ник (оставьте пустым для анонимности)
experience_years: 3
location: "Россия"  # или город: "Москва, Санкт-Петербург"

# Основные навыки (сопоставляются с требованиями заказа)
skills:
  - Python
  - Telegram Bot API
  - FastAPI
  - Django
  - PostgreSQL
  - Redis
  - Docker
  - Git
  - REST API
  - Парсинг данных
  - Веб-скрейпинг
  - Автоматизация процессов
  - Интеграция с API

# Дополнительные навыки (желательные, но не обязательные)
secondary_skills:
  - JavaScript
  - React
  - Vue.js
  - HTML/CSS
  - Linux администрирование
  - CI/CD
  - Nginx
  - Google Sheets API

# Портфолио и опыт (1–2 предложения, используются в письмах)
experience_summary: |
  Разработал более 20 Telegram-ботов для автоматизации бизнес-процессов: 
  от простых уведомлений до сложных CRM-систем с интеграцией платежей.
  Специализируюсь на парсинге данных, API-интеграциях и автоматизации.

# Стратегия ценообразования
pricing:
  # Стратегия: "minimum", "markup", "llm_estimate"
  # - minimum: всегда называть минимальный бюджет или чуть ниже рынка
  # - markup: цена = бюджет заказа * markup_percent или медиана рынка * markup
  # - llm_estimate: LLM оценивает часы и цену по требованиям
  strategy: "markup"
  
  # Коэффициент наценки (используется при strategy=markup)
  # Пример: 1.15 = назвать на 15% выше заявленного бюджета заказа
  markup_percent: 1.0
  
  # Минимальная допустимая цена (RUB)
  # Письма по заказам ниже этого порога НЕ отправляются
  min_acceptable_rub: 5000
  
  # Часовая ставка (RUB, используется при strategy=llm_estimate)
  hourly_rate_rub: 2000
  
  # Указывать цену в первом письме? (true/false)
  # Если false, письмо спрашивает заказчика о бюджете
  include_price_in_message: false

# Предпочтения по стилю письма
message_style:
  # Тон: "professional", "friendly", "casual"
  tone: "friendly"
  
  # Длина: "short" (2–3 предложения), "medium" (4–5), "long" (6–8)
  length: "medium"
  
  # Упоминать портфолио/прошлые проекты?
  mention_portfolio: true
  
  # Задавать уточняющие вопросы?
  ask_questions: true
  
  # Максимум эмодзи (0 = без эмодзи)
  max_emoji: 0
  
  # Фразы, которых нужно избегать (машинные шаблоны)
  banned_phrases:
    - "я являюсь"
    - "как опытный"
    - "готов предложить"
    - "надеюсь на сотрудничество"
    - "буду рад сотрудничеству"
    - "с удовольствием"
    - "в кратчайшие сроки"
    - "качественно и в срок"
    - "под ключ"
    - "комплексное решение"

# Доступность
availability:
  # Сколько часов в неделю доступно для новых проектов
  hours_per_week: 20
  
  # Можно ли начать сразу?
  immediate_start: true
  
  # Предпочтительная длительность проекта: "short" (<1 недели), "medium" (1–4 недели), "long" (1+ месяца), "any"
  preferred_duration: "any"

# Предпочтения по связи
communication:
  # Предпочтительные платформы для обсуждения: telegram, email, phone, zoom
  preferred_platforms:
    - telegram
    - email
  
  # Время ответа (используется в письмах при необходимости)
  typical_response_hours: 2
